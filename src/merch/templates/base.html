<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Merch Production{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="shell nav">
      <a class="brand" href="/">Merch Production</a>
      {% if request.session.get('actor') %}
      <a href="/copy-refresh">Copy refresh</a>
      <form action="/logout" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="quiet" type="submit">Sign out</button>
      </form>
      {% endif %}
    </header>
    <main class="shell">{% block content %}{% endblock %}</main>
  </body>
</html>
