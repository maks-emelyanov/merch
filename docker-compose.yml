name: merch-pod

x-app: &app
  build: .
  restart: unless-stopped
  env_file: ${MERCH_ENV_FILE:-.env}
  environment: &app-env
    MERCH_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/merch
    MERCH_TEMPORAL_TARGET: temporal:7233
    MERCH_STORAGE_BACKEND: s3
    MERCH_S3_ENDPOINT_URL: http://minio:9000
    MERCH_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MERCH_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  depends_on:
    migrate:
      condition: service_completed_successfully
    temporal:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merch"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.29.0}
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      # This file is bundled by the Temporal auto-setup image. Keeping the
      # path explicit makes upgrades predictable without requiring a local
      # bind mount.
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 30

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.42.1}
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    restart: "no"
    env_file: ${MERCH_ENV_FILE:-.env}
    environment:
      <<: *app-env
    command: [".venv/bin/merch", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: [".venv/bin/merch", "web"]
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: [".venv/bin/merch", "worker"]

  scheduler:
    <<: *app
    restart: "no"
    command: [".venv/bin/merch", "schedule"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"

  realesrgan:
    build:
      context: .
      dockerfile: docker/realesrgan/Dockerfile
    profiles: ["nvidia"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
